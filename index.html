<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>e · EBENE · EDIT · ENGINE</title>

<style>
  body {
    background:#000;
    color:#0f0;
    font-family: monospace;
    padding:20px;
  }

  .cluster {
    padding:6px 0;
    transition: opacity 0.4s ease;
  }

  .plop {
    color:#0f0;
    opacity:1;
  }

  .fade {
    opacity:0.2;
  }

  .null {
    opacity:0;
  }

  .err {
    color:#f00;
  }

  #identity {
    margin-bottom:20px;
    font-size:18px;
    color:#0ff;
  }
</style>
</head>
<body>

<h1>e · EBENE · EDIT · ENGINE</h1>

<div id="identity">IDENTITY: e‑0</div>

<h2>Cluster‑Scan</h2>
<div id="scan"></div>

<script>
// ---------------------------
// 1. Cluster-Liste
// ---------------------------
const clusters = [
  "CORE-X6D",
  "CORE-NE6D",
  "CORE-BEN9D",
  "DATA",
  "PORTENGINE",
  "HDFCORE",
  "HIWORLD",
  "XENGINEIX",
  "XENGINEXI",
  "USE-UI"
];

// ---------------------------
// 2. Fehler-Liste (Demo)
// ---------------------------
const errors = {
  "CORE-BEN9D": "tmp.room gefunden",
  "CORE-NE6D": "tmp,room gefunden"
};

// ---------------------------
// 3. HTML erzeugen
// ---------------------------
let html = "";
clusters.forEach(c => {
  const err = errors[c] ? `<span class='err'>✘ ${errors[c]}</span>` : "✔";
  html += `<div class='cluster' id='${c}'>${c} ${err}</div>`;
});
document.getElementById("scan").innerHTML = html;

// ---------------------------
// 4. Plop-Zyklus
// plop → fade → null → next → plop
// ---------------------------
let index = 0;
let identityCounter = 0;

function cycle() {
  const current = clusters[index];

  // 4.1 plop
  document.getElementById(current).className = "cluster plop";

  // 4.2 fade
  setTimeout(() => {
    document.getElementById(current).className = "cluster fade";
  }, 400);

  // 4.3 null
  setTimeout(() => {
    document.getElementById(current).className = "cluster null";
  }, 800);

  // 4.4 next
  setTimeout(() => {
    document.getElementById(current).className = "cluster";
    index = (index + 1) % clusters.length;

    // Identity erhöhen
    identityCounter++;
    document.getElementById("identity").innerText = "IDENTITY: e-" + identityCounter;

    // 4.5 plop next
    const next = clusters[index];
    document.getElementById(next).className = "cluster plop";
  }, 1200);
}

setInterval(cycle, 1600);
</script>

</body>
</html>
