<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>E · EBENE · EDIT · ENGINE · ALLXALL</title>

<style>
  body { background:#000; color:#0f0; font-family: monospace; padding:20px; }
  .cluster { padding:6px 0; transition: opacity 0.4s ease; }
  .plop { opacity:1; color:#0f0; }
  .fade { opacity:0.3; }
  .null { opacity:0; }
  .green { color:#0f0; }
  .yellow { color:#ff0; }
  .red { color:#f00; }
  #identity { margin-bottom:20px; font-size:18px; color:#0ff; }
</style>
</head>
<body>

<h1>E · EBENE · EDIT · ENGINE</h1>
<div id="identity">IDENTITY: e‑0</div>

<h2>Cluster‑Scan</h2>
<div id="scan"></div>

<script type="module">

import { EError } from "./E/e.error.js";
import { EMove } from "./E/e.move.js";
import { EScan } from "./E/e.scan.js";
import { ESignal } from "./E/e.signal.js";

const E = {
  identity: 0,
  index: 0,

  clusters: [
    "CORE-X6D",
    "CORE-NE6D",
    "CORE-BEN9D",
    "DATA",
    "PORTENGINE",
    "HDFCORE",
    "HIWORLD",
    "XENGINEIX",
    "XENGINEXI",
    "USE-UI"
  ],

  async cycle() {
    const current = this.clusters[this.index];
    const element = document.getElementById(current);

    const text = await EScan.read("/" + current);
    const errors = EError.scan(text);

    const color = ESignal.color(errors);
    ESignal.apply(element, color);

    EMove.apply(element, "plop");
    setTimeout(() => EMove.apply(element, "fade"), 400);
    setTimeout(() => EMove.apply(element, "null"), 800);

    setTimeout(() => {
      EMove.apply(element, "");
      this.index = (this.index + 1) % this.clusters.length;

      this.identity++;
      document.getElementById("identity").innerText = "IDENTITY: e-" + this.identity;

      const next = this.clusters[this.index];
      EMove.apply(document.getElementById(next), "plop");
    }, 1200);
  }
};

setInterval(() => E.cycle(), EMove.speed);

let html = "";
E.clusters.forEach(c => html += `<div class='cluster' id='${c}'>${c}</div>`);
document.getElementById("scan").innerHTML = html;

</script>

</body>
</html>
